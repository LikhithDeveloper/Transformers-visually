<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transformers, Visually</title>
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('tv-theme'); } catch (e) {}
        var forced = new URLSearchParams(window.location.search).get('theme');
        if (forced === 'light' || forced === 'dark') saved = forced;
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
